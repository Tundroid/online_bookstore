<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="nav-container"></div>
    <div class="container mt-4" id="admin-page">
        <h2 class="mb-4">Admin Dashboard</h2>
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item"><button class="nav-link active" onclick="app.switchAdminTab('sales'); this.classList.add('active'); this.parentElement.nextElementSibling.firstElementChild.classList.remove('active');">Sales Report</button></li>
            <li class="nav-item"><button class="nav-link" onclick="app.switchAdminTab('books'); this.classList.add('active'); this.parentElement.previousElementSibling.firstElementChild.classList.remove('active');">Manage Books</button></li>
        </ul>
        
        <div id="admin-sales-tab">
            <div class="row mb-3 bg-white p-3 shadow-sm rounded">
                <div class="col"><input type="text" id="sales-book-filter" class="form-control" placeholder="Book Title"></div>
                <div class="col"><input type="text" id="sales-customer-filter" class="form-control" placeholder="Customer"></div>
                <div class="col"><input type="date" id="sales-start-date" class="form-control"></div>
                <div class="col"><input type="date" id="sales-end-date" class="form-control"></div>
                <div class="col"><button class="btn btn-primary w-100" onclick="app.loadSales()">Filter Reports</button></div>
            </div>
            <div id="sales-report-container" class="bg-white p-3 shadow-sm rounded"></div>
        </div>
        <div id="admin-books-tab" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Book Inventory</h4>
                <button class="btn btn-success" onclick="app.openBookForm()">Add Book</button>
            </div>
            <div id="admin-book-form" class="card mb-3 d-none">
                <div class="card-body">
                    <h5 id="admin-book-form-title">Add Book</h5>
                    <form id="admin-book-form-element" onsubmit="app.saveBook(event)">
                        <input type="hidden" id="admin-book-id">
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label">Title</label><input type="text" id="admin-book-title" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Author</label><input type="text" id="admin-book-author" class="form-control" required></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label">Publisher</label><input type="text" id="admin-book-publisher" class="form-control"></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Genre</label><input type="text" id="admin-book-genre" class="form-control"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="form-label">Price</label><input type="number" step="0.01" id="admin-book-price" class="form-control" required></div>
                            <div class="col-md-4 mb-3"><label class="form-label">Stock</label><input type="number" min="0" id="admin-book-stock" class="form-control" required></div>
                            <div class="col-md-4 mb-3"><label class="form-label">Image URL</label><input type="url" id="admin-book-image_url" class="form-control"></div>
                        </div>
                        <div class="mb-3"><label class="form-label">Description</label><textarea id="admin-book-description" class="form-control" rows="3"></textarea></div>
                        <div class="d-flex justify-content-end">
                            <button type="button" class="btn btn-secondary me-2" onclick="document.getElementById('admin-book-form').classList.add('d-none')">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Book</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light"><tr>
                        <th>ID</th><th>Title</th><th>Author</th><th>Genre</th><th>Price</th><th>Stock</th><th>Actions</th>
                    </tr></thead>
                    <tbody id="admin-books-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
