<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join BookStore | Secure Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none text-dark">
                    <h1 class="fw-bold"><i class="bi bi-book-half text-primary"></i> BookStore</h1>
                </a>
            </div>
            
            <div class="card shadow-lg p-4">
                <div class="card-body">
                    <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active rounded-pill" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Login</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link rounded-pill" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Register</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Login Form -->
                        <div class="tab-pane fade show active" id="login">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" id="loginUsername" placeholder="Enter your username" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-bold">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In</button>
                            </form>
                        </div>

                        <!-- Register Form -->
                        <div class="tab-pane fade" id="register">
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Username</label>
                                    <input type="text" class="form-control" id="regUsername" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Email Address</label>
                                    <input type="email" class="form-control" id="regEmail" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-bold">Password</label>
                                    <input type="password" class="form-control" id="regPassword" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Create Account</button>
                            </form>
                        </div>
                    </div>
                    
                    <div id="message" class="mt-4 alert d-none text-center small"></div>
                </div>
            </div>
            
            <p class="text-center mt-4 text-muted small">
                &copy; 2025 BookStore Management System
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const messageDiv = document.getElementById('message');

    function showMessage(msg, isSuccess) {
        messageDiv.textContent = msg;
        messageDiv.className = `mt-4 alert ${isSuccess ? 'alert-success' : 'alert-danger'}`;
        messageDiv.classList.remove('d-none');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('username', document.getElementById('loginUsername').value);
        formData.append('password', document.getElementById('loginPassword').value);

        const resp = await fetch('../backend/auth.php?action=login', {
            method: 'POST',
            body: formData
        });
        const result = await resp.json();
        showMessage(result.message, result.success);
        if (result.success) {
            setTimeout(() => window.location.href = 'index.html', 1000);
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('username', document.getElementById('regUsername').value);
        formData.append('email', document.getElementById('regEmail').value);
        formData.append('password', document.getElementById('regPassword').value);

        const resp = await fetch('../backend/auth.php?action=register', {
            method: 'POST',
            body: formData
        });
        const result = await resp.json();
        showMessage(result.message, result.success);
        if (result.success) {
            document.getElementById('registerForm').reset();
            setTimeout(() => {
                document.getElementById('login-tab').click();
                messageDiv.classList.add('d-none');
            }, 2000);
        }
    });
</script>
</body>
</html>
