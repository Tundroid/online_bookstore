<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="nav-container"></div>
    <div class="container mt-5" id="auth-page">
        <div class="row justify-content-center"><div class="col-md-5">
            <div class="card shadow"><div class="card-body p-4">
                <h3 id="auth-title" class="mb-4 text-center fw-bold">Login</h3>
                <form id="auth-form" onsubmit="app.handleAuth(event)">
                    <div class="mb-3"><label class="form-label">Username</label><input type="text" id="auth-username" class="form-control" required></div>
                    <div class="mb-3 d-none" id="auth-email-group"><label class="form-label">Email Address</label><input type="email" id="auth-email" class="form-control"></div>
                    <div class="mb-4"><label class="form-label">Password</label><input type="password" id="auth-password" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100 mb-3" id="auth-btn">Login</button>
                </form>
                <div class="text-center">
                    <button class="btn btn-link text-decoration-none" onclick="app.toggleAuthMode()" id="auth-toggle-link">Need an account? Register</button>
                </div>
            </div></div>
        </div></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
