<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html"><i class="bi bi-book-half me-2"></i>BookStore</a>
    </div>
</nav>

<div class="container py-4">
    <div class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-4">Shopping Cart</h3>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="text-muted small">
                                <tr>
                                    <th>PRODUCT</th>
                                    <th>PRICE</th>
                                    <th>QUANTITY</th>
                                    <th>TOTAL</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="cartItems">
                                <!-- Cart items loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <a href="index.html" class="btn btn-link text-decoration-none p-0"><i class="bi bi-arrow-left me-2"></i>Continue Shopping</a>
        </div>
        
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span id="summarySubtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Shipping</span>
                        <span class="text-success">FREE</span>
                    </div>
                    <hr class="my-3">
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fw-bold">Total</span>
                        <span class="fw-bold h4 mb-0" id="cartTotal">$0.00</span>
                    </div>
                    <a href="checkout.html" class="btn btn-primary w-100 py-3 fw-bold">Checkout Now</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadCart() {
        const resp = await fetch('../backend/cart.php?action=list');
        const items = await resp.json();
        
        if (!Array.isArray(items)) {
            window.location.href = 'auth.html';
            return;
        }

        const tbody = document.getElementById('cartItems');
        tbody.innerHTML = '';
        let total = 0;

        if (items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5"><i class="bi bi-cart-x fs-1 text-muted"></i><p class="mt-3">Your cart is empty</p></td></tr>';
        } else {
            items.forEach(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div class="d-flex align-items-center">
                                <img src="${item.image_url || 'https://via.placeholder.com/60x80'}" width="60" class="rounded shadow-sm me-3">
                                <div>
                                    <div class="fw-bold text-dark">${item.title}</div>
                                    <small class="text-muted">${item.author}</small>
                                </div>
                            </div>
                        </td>
                        <td>$${item.price}</td>
                        <td style="width: 120px;">
                            <div class="input-group input-group-sm">
                                <input type="number" class="form-control text-center update-qty" 
                                    data-id="${item.book_id}" value="${item.quantity}" min="1">
                            </div>
                        </td>
                        <td class="fw-bold">$${subtotal.toFixed(2)}</td>
                        <td class="text-end">
                            <button class="btn btn-link text-danger p-0 remove-item" data-id="${item.book_id}"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }
        document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
        document.getElementById('summarySubtotal').textContent = `$${total.toFixed(2)}`;
    }

    document.addEventListener('change', async (e) => {
        if (e.target.classList.contains('update-qty')) {
            const bookId = e.target.getAttribute('data-id');
            const qty = e.target.value;
            await fetch('../backend/cart.php?action=update', {
                method: 'POST',
                body: new URLSearchParams({ book_id: bookId, quantity: qty })
            });
            loadCart();
        }
    });

    document.addEventListener('click', async (e) => {
        const btn = e.target.closest('.remove-item');
        if (btn) {
            const bookId = btn.getAttribute('data-id');
            await fetch('../backend/cart.php?action=remove', {
                method: 'POST',
                body: new URLSearchParams({ book_id: bookId })
            });
            loadCart();
        }
    });

    loadCart();
</script>
</body>
</html>
