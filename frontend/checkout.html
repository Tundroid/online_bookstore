<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Secure Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark mb-5">
    <div class="container">
        <a class="navbar-brand" href="index.html"><i class="bi bi-book-half me-2"></i>BookStore</a>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-5">
        <div class="col-lg-7">
            <h3 class="fw-bold mb-4">Shipping Information</h3>
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form id="checkoutForm">
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-muted">SHIPPING ADDRESS</label>
                            <textarea id="address" class="form-control" rows="3" placeholder="Enter your full delivery address..." required></textarea>
                        </div>
                        <div class="mb-5">
                            <label class="form-label fw-bold small text-muted">PAYMENT METHOD</label>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <input type="radio" class="btn-check" name="payment" id="payCC" value="Credit Card" checked>
                                    <label class="btn btn-outline-secondary w-100 py-3 text-start px-3" for="payCC">
                                        <i class="bi bi-credit-card me-2"></i> Credit Card
                                    </label>
                                </div>
                                <div class="col-md-6">
                                    <input type="radio" class="btn-check" name="payment" id="payMM" value="Mobile Money">
                                    <label class="btn btn-outline-secondary w-100 py-3 text-start px-3" for="payMM">
                                        <i class="bi bi-phone me-2"></i> Mobile Money
                                    </label>
                                </div>
                                <div class="col-md-6">
                                    <input type="radio" class="btn-check" name="payment" id="payPP" value="PayPal">
                                    <label class="btn btn-outline-secondary w-100 py-3 text-start px-3" for="payPP">
                                        <i class="bi bi-paypal me-2"></i> PayPal
                                    </label>
                                </div>
                                <div class="col-md-6">
                                    <input type="radio" class="btn-check" name="payment" id="payCD" value="Cash on Delivery">
                                    <label class="btn btn-outline-secondary w-100 py-3 text-start px-3" for="payCD">
                                        <i class="bi bi-cash me-2"></i> Cash on Delivery
                                    </label>
                                </div>
                            </div>
                        </div>
                        <hr class="my-4">
                        <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold shadow">
                            Complete Order & Pay
                        </button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-lg-5">
            <h3 class="fw-bold mb-4">Order Summary</h3>
            <div class="card border-0 shadow-sm sticky-top" style="top: 100px;">
                <div class="card-body p-4">
                    <div id="summaryItems" class="mb-4"></div>
                    <div class="bg-light p-3 rounded-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span id="subTotal">$0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Delivery</span>
                            <span class="text-success fw-bold">FREE</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between h4 fw-bold mb-0">
                            <span>Grand Total</span>
                            <span id="summaryTotal" class="text-primary">$0.00</span>
                        </div>
                    </div>
                    <p class="text-center small text-muted mt-4">
                        <i class="bi bi-shield-lock me-1"></i> SSL Encrypted Secure Checkout
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadSummary() {
        const resp = await fetch('../backend/cart.php?action=list');
        const items = await resp.json();
        
        if (!Array.isArray(items) || items.length === 0) {
            window.location.href = 'index.html';
            return;
        }

        const summary = document.getElementById('summaryItems');
        let total = 0;
        items.forEach(item => {
            total += item.price * item.quantity;
            summary.innerHTML += `
                <div class="d-flex align-items-center mb-3">
                    <img src="${item.image_url || 'https://via.placeholder.com/40x60'}" width="40" class="rounded me-3 shadow-sm">
                    <div class="flex-grow-1 overflow-hidden">
                        <div class="text-truncate fw-bold small">${item.title}</div>
                        <div class="text-muted extra-small">Qty: ${item.quantity}</div>
                    </div>
                    <div class="fw-bold small ms-2">$${(item.price * item.quantity).toFixed(2)}</div>
                </div>
            `;
        });
        document.getElementById('subTotal').textContent = `$${total.toFixed(2)}`;
        document.getElementById('summaryTotal').textContent = `$${total.toFixed(2)}`;
    }

    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';

        const formData = new FormData();
        formData.append('address', document.getElementById('address').value);
        formData.append('payment', e.target.querySelector('input[name="payment"]:checked').value);

        const resp = await fetch('../backend/orders.php?action=create', {
            method: 'POST',
            body: formData
        });
        const result = await resp.json();
        if (result.success) {
            window.location.href = 'orders.html?success=1';
        } else {
            alert(result.message);
            btn.disabled = false;
            btn.innerHTML = 'Complete Order & Pay';
        }
    });

    loadSummary();
</script>
<style>
    .extra-small { font-size: 0.75rem; }
</style>
</body>
</html>
