<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Secure Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
<div id="nav-container"></div>

<div id="checkout-alerts" class="container mt-3"></div>

<div class="container pb-5">
    <div class="row g-5">
        <div class="col-lg-7">
            <h3 class="fw-bold mb-4">Shipping Information</h3>
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form id="checkout-form" onsubmit="app.handleCheckout(event)">
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-muted">SHIPPING ADDRESS</label>
                            <textarea id="shipping-address" class="form-control" rows="3" placeholder="Enter or select a previous address..." list="address-history" minlength="10" required></textarea><datalist id="address-history"></datalist>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">PAYMENT METHOD</label>
                            <select id="payment-method" class="form-select" required>
                                <option value="MTN MoMo">MTN MoMo</option>
                                <option value="Orange Money">Orange Money</option>
                                <option value="Cash on Delivery">Cash on Delivery</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-muted">PHONE NUMBER <span class="text-muted">(required for mobile money)</span></label>
                            <input id="payment-phone" type="tel" class="form-control" placeholder="e.g. 675123456" pattern="[0-9]{8,12}">
                            <div class="form-text small">For Cash on Delivery you may leave this blank.</div>
                        </div>
                        <hr class="my-4">
                        <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold shadow">
                            Complete Order & Pay
                        </button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-lg-5">
            <h3 class="fw-bold mb-4">Order Summary</h3>
            <div class="card border-0 shadow-sm sticky-top" style="top: 100px;">
                <div class="card-body p-4">
                    <div id="summaryItems" class="mb-4"></div>
                    <div class="bg-light p-3 rounded-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span id="subTotal">0 FCFA</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Delivery</span>
                            <span class="text-success fw-bold">FREE</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between h4 fw-bold mb-0">
                            <span>Grand Total</span>
                            <span id="summaryTotal" class="text-primary">0 FCFA</span>
                        </div>
                    </div>
                    <p class="text-center small text-muted mt-4">
                        <i class="bi bi-shield-lock me-1"></i> SSL Encrypted Secure Checkout
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
    // Local fallback alert (app.showAlert will be preferred if available)
    function showAlert(message, type = 'danger', timeout = 4000) {
        const container = document.getElementById('checkout-alerts') || (function(){ const d=document.createElement('div'); d.id='checkout-alerts'; document.body.prepend(d); return d; })();
        const div = document.createElement('div');
        div.className = `alert alert-${type} alert-dismissible fade show`;
        div.role = 'alert';
        div.innerHTML = `${message} <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>`;
        container.appendChild(div);
        if (timeout > 0) setTimeout(() => { try { div.remove(); } catch(e){} }, timeout);
    }

    async function loadSummary() {
        const resp = await fetch('../backend/cart.php?action=list');
        const items = await resp.json();
        
        if (!Array.isArray(items) || items.length === 0) {
            window.location.href = 'index.html';
            return;
        }

        const summary = document.getElementById('summaryItems');
        let total = 0;
        items.forEach(item => {
            total += item.price * item.quantity;
            summary.innerHTML += `
                <div class="d-flex align-items-center mb-3">
                    <img src="${item.image_url || 'https://via.placeholder.com/40x60'}" width="40" class="rounded me-3 shadow-sm">
                    <div class="flex-grow-1 overflow-hidden">
                        <div class="text-truncate fw-bold small">${item.title}</div>
                        <div class="text-muted extra-small">Qty: ${item.quantity}</div>
                    </div>
                    <div class="fw-bold small ms-2">${Number(item.price * item.quantity).toLocaleString('en-US', { maximumFractionDigits: 0 })} FCFA</div>
                </div>
            `;
        });
        document.getElementById('subTotal').textContent = `${Number(total).toLocaleString('en-US', { maximumFractionDigits: 0 })} FCFA`;
        document.getElementById('summaryTotal').textContent = `${Number(total).toLocaleString('en-US', { maximumFractionDigits: 0 })} FCFA`;
    }

    function populateAddressHistory() {
        const addresses = JSON.parse(localStorage.getItem('addressHistory') || '[]');
        const datalist = document.getElementById('address-history');
        if (datalist) {
            datalist.innerHTML = addresses.map(addr => `<option value="${addr}">`).join('');
        }
    }

    // Initialize dynamic navbar and address suggestions (uses shared app.js)
    function initCheckoutPage() {
        populateAddressHistory();
        if (typeof app !== 'undefined') {
            app.checkAuth().then(() => {
                app.renderNav();
                if (app.user) {
                    app.loadCartCount().then(() => app.renderNav());
                }
            }).catch(() => {});
            // Also expose a global for any fallback
            window.app = app;
        }
    }

    loadSummary();
    // Delay a bit so app.js has registered the app object
    setTimeout(initCheckoutPage, 30);
</script>
<style>
    .extra-small { font-size: 0.75rem; }
</style>
</body>
</html>
