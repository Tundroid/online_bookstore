<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html">BookStore</a>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h4 class="card-title mb-4">Shipping & Payment</h4>
                    <form id="checkoutForm">
                        <div class="mb-3">
                            <label for="address" class="form-label">Shipping Address</label>
                            <textarea id="address" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="payment" class="form-label">Payment Method</label>
                            <select id="payment" class="form-select" required>
                                <option value="Credit Card">Credit Card</option>
                                <option value="PayPal">PayPal</option>
                                <option value="Mobile Money">Mobile Money</option>
                                <option value="Cash on Delivery">Cash on Delivery</option>
                            </select>
                        </div>
                        <hr>
                        <button type="submit" class="btn btn-primary btn-lg w-100">Place Order</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Order Summary</h5>
                    <div id="summaryItems"></div>
                    <hr>
                    <div class="d-flex justify-content-between h4">
                        <span>Total:</span>
                        <span id="summaryTotal">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadSummary() {
        const resp = await fetch('../backend/cart.php?action=list');
        const items = await resp.json();
        
        if (!Array.isArray(items) || items.length === 0) {
            window.location.href = 'index.html';
            return;
        }

        const summary = document.getElementById('summaryItems');
        let total = 0;
        items.forEach(item => {
            total += item.price * item.quantity;
            summary.innerHTML += `
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-truncate" style="max-width: 150px;">${item.title} x ${item.quantity}</span>
                    <span>$${(item.price * item.quantity).toFixed(2)}</span>
                </div>
            `;
        });
        document.getElementById('summaryTotal').textContent = `$${total.toFixed(2)}`;
    }

    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('address', document.getElementById('address').value);
        formData.append('payment', document.getElementById('payment').value);

        const resp = await fetch('../backend/orders.php?action=create', {
            method: 'POST',
            body: formData
        });
        const result = await resp.json();
        if (result.success) {
            alert('Order placed successfully!');
            window.location.href = 'orders.html';
        } else {
            alert(result.message);
        }
    });

    loadSummary();
</script>
</body>
</html>
