<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html">BookStore</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div id="bookDetails" class="row">
        <!-- Details loaded here -->
    </div>
</div>

<script>
    async function loadDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const resp = await fetch(`../backend/books.php?action=details&id=${id}`);
        const book = await resp.json();

        const container = document.getElementById('bookDetails');
        if (!book) {
            container.innerHTML = '<h2>Book not found.</h2>';
            return;
        }

        container.innerHTML = `
            <div class="col-md-5">
                <img src="${book.image_url || 'https://via.placeholder.com/400x600?text=No+Cover'}" class="img-fluid rounded shadow" alt="${book.title}">
            </div>
            <div class="col-md-7">
                <h1>${book.title}</h1>
                <p class="lead text-muted">by ${book.author}</p>
                <hr>
                <p><strong>Genre:</strong> ${book.genre}</p>
                <p><strong>Price:</strong> <span class="text-primary h3">$${book.price}</span></p>
                <p><strong>Stock:</strong> ${book.stock > 0 ? book.stock + ' available' : '<span class="text-danger">Out of stock</span>'}</p>
                <div class="my-4">
                    <h5>Description</h5>
                    <p>${book.description}</p>
                </div>
                <button class="btn btn-primary btn-lg" id="addToCartBtn" ${book.stock <= 0 ? 'disabled' : ''}>Add to Cart</button>
            </div>
        `;

        document.getElementById('addToCartBtn').addEventListener('click', async () => {
            const res = await fetch('../backend/cart.php?action=add', {
                method: 'POST',
                body: new URLSearchParams({ book_id: id, quantity: 1 })
            });
            const result = await res.json();
            alert(result.message);
            if (!result.success && result.message === 'Please login first.') {
                window.location.href = 'auth.html';
            }
        });
    }
    loadDetails();
</script>
</body>
</html>
