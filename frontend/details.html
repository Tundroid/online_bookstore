<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details | BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html"><i class="bi bi-book-half me-2"></i>BookStore</a>
    </div>
</nav>

<div class="container py-5">
    <div id="bookDetails" class="row g-5">
        <!-- Skeleton -->
        <div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
</div>

<script>
    async function loadDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const resp = await fetch(`../backend/books.php?action=details&id=${id}`);
        const book = await resp.json();

        const container = document.getElementById('bookDetails');
        if (!book) {
            container.innerHTML = '<div class="col-12 text-center"><h2>Book not found.</h2><a href="index.html" class="btn btn-primary mt-3">Back to Catalog</a></div>';
            return;
        }

        container.innerHTML = `
            <div class="col-md-5">
                <div class="position-sticky" style="top: 100px;">
                    <img src="${book.image_url || 'https://via.placeholder.com/600x800?text=No+Cover'}" class="img-fluid rounded-4 shadow-lg w-100" alt="${book.title}">
                </div>
            </div>
            <div class="col-md-7">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="index.html">Catalog</a></li>
                        <li class="breadcrumb-item active">${book.genre || 'Book'}</li>
                    </ol>
                </nav>
                <h1 class="display-5 fw-bold mb-2">${book.title}</h1>
                <p class="h4 text-muted mb-4">by ${book.author}</p>
                
                <div class="d-flex align-items-center mb-4">
                    <span class="h2 fw-bold text-primary mb-0 me-3">$${book.price}</span>
                    <span class="badge ${book.stock > 0 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'} px-3 py-2">
                        ${book.stock > 0 ? 'In Stock ('+book.stock+')' : 'Out of Stock'}
                    </span>
                </div>

                <div class="card bg-light border-0 mb-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3 text-uppercase small letter-spacing-1">Description</h5>
                        <p class="lead-sm text-secondary mb-0" style="line-height: 1.8;">${book.description}</p>
                    </div>
                </div>

                <div class="d-grid gap-3">
                    <button class="btn btn-primary btn-lg py-3 fw-bold" id="addToCartBtn" ${book.stock <= 0 ? 'disabled' : ''}>
                        <i class="bi bi-cart-plus me-2"></i>Add to Shopping Cart
                    </button>
                    <a href="index.html" class="btn btn-outline-secondary py-3 fw-bold">
                        Browse More Books
                    </a>
                </div>
                
                <div class="row mt-5 g-4 text-center">
                    <div class="col-4">
                        <i class="bi bi-truck fs-3 text-primary mb-2 d-block"></i>
                        <span class="small text-muted">Free Delivery</span>
                    </div>
                    <div class="col-4">
                        <i class="bi bi-shield-check fs-3 text-primary mb-2 d-block"></i>
                        <span class="small text-muted">Secure Payment</span>
                    </div>
                    <div class="col-4">
                        <i class="bi bi-arrow-counterclockwise fs-3 text-primary mb-2 d-block"></i>
                        <span class="small text-muted">Easy Returns</span>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('addToCartBtn').addEventListener('click', async (e) => {
            const btn = e.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Adding...';
            
            const res = await fetch('../backend/cart.php?action=add', {
                method: 'POST',
                body: new URLSearchParams({ book_id: id, quantity: 1 })
            });
            const result = await res.json();
            
            if (result.success) {
                btn.innerHTML = '<i class="bi bi-check2-circle me-2"></i>Added to Cart';
                btn.classList.replace('btn-primary', 'btn-success');
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-cart-plus me-2"></i>Add to Shopping Cart';
                    btn.classList.replace('btn-success', 'btn-primary');
                }, 3000);
            } else {
                alert(result.message);
                if (result.message === 'Please login first.') window.location.href = 'auth.html';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cart-plus me-2"></i>Add to Shopping Cart';
            }
        });
    }
    loadDetails();
</script>
</body>
</html>
