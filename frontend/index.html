<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bookstore - Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="nav-container"></div>
    
    <div class="container" id="catalog-page">
        <div class="row mb-4 bg-white p-3 shadow-sm rounded">
            <div class="col-md-3 mb-2"><input type="text" id="search-title" class="form-control" placeholder="Search Title..."></div>
            <div class="col-md-3 mb-2"><input type="text" id="search-author" class="form-control" placeholder="Author..."></div>
            <div class="col-md-3 mb-2">
                <select id="search-genre" class="form-select">
                    <option value="">All Genres</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Classic">Classic</option>
                    <option value="Historical">Historical</option>
                    <option value="Poetry">Poetry</option>
                </select>
            </div>
            <div class="col-md-3 mb-2"><button class="btn btn-primary w-100" onclick="app.loadCatalog(1)">Search Filter</button></div>
            <div class="col-md-3 mb-2"><button class="btn btn-outline-secondary w-100" onclick="app.clearCatalogFilters()">Reset Filters</button></div>
        </div>
        
        <div class="row" id="books-container"></div>
        <ul class="pagination justify-content-center mt-4" id="pagination-controls"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
