<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice | BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="nav-container"></div>
    <div class="container py-5" id="invoice-page">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
            <div>
                <h1 class="fw-bold">Invoice</h1>
                <p class="text-muted mb-0">A detailed receipt for the selected order.</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary" onclick="window.history.back()">Back</button>
                <button class="btn btn-primary" onclick="window.print()">Print Invoice</button>
            </div>
        </div>
        <div id="invoice-container"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
