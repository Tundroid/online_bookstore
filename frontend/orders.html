<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html">BookStore</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Order History</h2>
    <div id="orderList" class="accordion shadow-sm">
        <!-- Orders loaded here -->
    </div>
</div>

<script>
    async function loadOrders() {
        const resp = await fetch('../backend/orders.php?action=list');
        const orders = await resp.json();
        
        if (!Array.isArray(orders)) {
            window.location.href = 'auth.html';
            return;
        }

        const container = document.getElementById('orderList');
        if (orders.length === 0) {
            container.innerHTML = '<div class="alert alert-info">You haven\'t placed any orders yet.</div>';
            return;
        }

        for (const order of orders) {
            const statusClass = order.status === 'Delivered' ? 'bg-success' : (order.status === 'Pending' ? 'bg-warning' : 'bg-primary');
            const orderDiv = document.createElement('div');
            orderDiv.className = 'accordion-item';
            orderDiv.innerHTML = `
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#order${order.id}">
                        <div class="d-flex justify-content-between w-100 me-3">
                            <span>Order #${order.id} - ${new Date(order.created_at).toLocaleDateString()}</span>
                            <span>$${order.total_price}</span>
                            <span class="badge ${statusClass}">${order.status}</span>
                        </div>
                    </button>
                </h2>
                <div id="order${order.id}" class="accordion-collapse collapse">
                    <div class="accordion-body">
                        <p><strong>Shipping Address:</strong> ${order.shipping_address}</p>
                        <p><strong>Payment Method:</strong> ${order.payment_method}</p>
                        <hr>
                        <h6>Items:</h6>
                        <ul class="list-group" id="items${order.id}">
                            <li class="list-group-item">Loading items...</li>
                        </ul>
                    </div>
                </div>
            `;
            container.appendChild(orderDiv);
            loadOrderItems(order.id);
        }
    }

    async function loadOrderItems(orderId) {
        const resp = await fetch(`../backend/orders.php?action=details&id=${orderId}`);
        const items = await resp.json();
        const list = document.getElementById(`items${orderId}`);
        list.innerHTML = '';
        items.forEach(item => {
            list.innerHTML += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>${item.title}</strong> by ${item.author}<br>
                        <small>Qty: ${item.quantity} | Price: $${item.price_at_purchase}</small>
                    </div>
                    <span>$${(item.quantity * item.price_at_purchase).toFixed(2)}</span>
                </li>
            `;
        });
    }

    loadOrders();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
