<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="nav-container"></div>
    <div class="container mt-4" id="profile-page">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm"><div class="card-body">
                    <h4 class="mb-3 fw-bold">Edit Profile</h4>
                    <form id="profile-form" onsubmit="app.handleProfileUpdate(event)">
                        <div class="mb-3"><label class="form-label">Email</label><input type="email" id="profile-email" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">New Password</label><input type="password" id="profile-password" class="form-control" placeholder="Leave blank to keep current"></div>
                        <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                    </form>
                </div></div>
            </div>
            <div class="col-md-8">
                <div id="order-summary" class="row mb-4"></div>
                <h4 class="fw-bold mb-3">Order History</h4>
                <div id="orders-container"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
